services:
  postgres:
    image: postgres:17
    container_name: laruta-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PGDATABASE}
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - laruta-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PGUSER} -d $${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  laruta-pgdata: