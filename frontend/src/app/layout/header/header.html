<header class="flex items-center justify-between p-6">
  <a routerLink="/" class="text-3xl font-bold text-amber-700">La Ruta</a>
  <nav class="flex gap-4 text-stone-600">
    @if (authService.isAuthenticated()) {
      <a routerLink="/" class="hover:text-amber-700">Mis bares</a>
      <button type="button" (click)="logout()" class="hover:text-amber-700">Salir</button>
    } @else {
      <a routerLink="/login" class="hover:text-amber-700">Entrar</a>

    }
  </nav>
</header>
