<div class="mt-4 border-t border-line pt-3">
  @if (!confirming()) {
    <button type="button" (click)="confirming.set(true)" class="eyebrow cursor-pointer text-wine hover:underline">
      Quitar tapa del bar
    </button>
  } @else {
    <div
      role="alertdialog"
      [attr.aria-label]="'Quitar ' + tapaName() + ' de este bar'"
      class="rounded-xs border-[1.5px] border-wine bg-paper p-3"
    >
      <p class="font-bold">¿Quitar {{ tapaName() }} de este bar?</p>
      <p class="mt-1 text-sm text-muted">
        Se quitará para toda la comunidad, junto con todas sus valoraciones en este bar.
        En los demás bares que la pongan seguirá igual.
      </p>

      <div class="mt-3 grid grid-cols-2 gap-2">
        <button appButton variant="secondary" type="button" (click)="confirming.set(false)" [disabled]="removing()">
          Cancelar
        </button>
        <button appButton type="button" (click)="remove()" [disabled]="removing()">
          {{ removing() ? 'Quitando…' : 'Sí, quitar' }}
        </button>
      </div>

      @if (removeError(); as message) {
        <app-error-box class="mt-3" [message]="message" />
      }
    </div>
  }
</div>
