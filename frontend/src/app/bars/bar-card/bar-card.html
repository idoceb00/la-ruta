<a [routerLink]="['/bars', bar().id]" class="group block border-b border-ink py-4">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <h2 class="font-display text-2xl leading-tight font-extrabold uppercase group-hover:text-wine">
        <app-highlight-text [text]="bar().name" [query]="query()" />
      </h2>
      @if (bar() | barLocation; as location) {
        <p class="mt-0.5 text-sm text-muted">
          <app-highlight-text [text]="location" [query]="query()" />
        </p>
      }
    </div>

    @if (bar().averageRating !== null) {
      <div class="shrink-0 text-right">
        <span class="font-display text-2xl font-extrabold">{{ bar().averageRating | number: '1.0-1' }}</span>
        <span class="text-xs font-bold text-muted">/10</span>
      </div>
    } @else {
      <span class="eyebrow shrink-0 pt-2 text-muted">Sin valorar</span>
    }
  </div>
</a>
