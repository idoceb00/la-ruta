<article class="rounded-xl bg-white p-4 shadow-sm">
  <div class="flex items-start justify-between">
    <div>
      <h2 class="text-lg font-semibold text-stone-800">{{ bar().name }}</h2>
      <p class="text-sm text-stone-500">
        {{ bar().city }}
        @if (bar().zone) {
          · {{ bar().zone }}
        }
      </p>
    </div>

    @if (bar().rating !== null) {
      <span class="rounded-full bg-amber-100 px-3 py-1 text-sm font-semibold text-amber-800">
        {{ bar().rating }}/10
      </span>
    } @else {
      <span class="text-sm text-stone-400">Sin valorar</span>
    }
  </div>
</article>
