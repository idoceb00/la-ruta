<a [routerLink]="['/bars', bar().id]" class="block rounded-xl bg-white p-4 shadow-sm transition hover:shadow-md">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h2 class="text-lg font-semibold text-stone-800">{{ bar().name }}</h2>
      @if (location()) {
        <p class="text-sm text-stone-500">{{ location() }}</p>
      }
    </div>

    @if (bar().averageRating !== null) {
      <span class="shrink-0 rounded-full bg-amber-100 px-3 py-1 text-sm font-semibold text-amber-800">
        {{ bar().averageRating | number: '1.0-1' }}/10
      </span>
    } @else {
      <span class="shrink-0 text-sm text-stone-400">Sin valorar</span>
    }
  </div>
</a>
