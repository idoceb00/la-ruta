<section class="mt-6">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-stone-500">Tapas</h2>

  @if (tapas().length === 0) {
    <p class="mt-2 text-sm text-stone-400">Todavía no hay tapas en este bar.</p>
  } @else {
    <ul class="mt-2 divide-y divide-stone-200 rounded-lg border border-stone-200">
      @for (tapa of tapas(); track tapa.tapaId) {
        <li>
          <button
            type="button"
            (click)="toggle(tapa.tapaId)"
            [attr.aria-expanded]="expandedTapaId() === tapa.tapaId"
            class="flex w-full items-start justify-between gap-4 p-3 text-left hover:bg-stone-50"
          >
            <span class="block min-w-0">
              <span class="block font-medium text-stone-800">
                {{ tapa.tapaName }}
                @if (tapa.myReview?.fav) {
                  <span class="text-amber-500" title="Favorita" aria-label="Favorita">★</span>
                }
              </span>

              @if (tapa.myReview; as review) {
                @if (review.rating !== null) {
                  <span class="mt-1 block text-sm text-stone-500">Mi nota: {{ review.rating }}/5</span>
                }
                @if (review.notes) {
                  <span class="mt-1 line-clamp-2 block text-sm text-stone-600">{{ review.notes }}</span>
                }
              }
            </span>

            @if (tapa.averageRating !== null) {
              <span class="block shrink-0 text-right">
                <span class="rounded-full bg-amber-100 px-2 py-0.5 text-sm font-semibold text-amber-800">
                  {{ tapa.averageRating | number: '1.0-1' }}/5
                </span>
                <span class="mt-1 block text-xs text-stone-500">
                  {{ tapa.ratingCount }} {{ tapa.ratingCount === 1 ? 'valoración' : 'valoraciones' }}
                </span>
              </span>
            } @else {
              <span class="shrink-0 text-sm text-stone-400">Sin valoraciones</span>
            }
          </button>

          @if (expandedTapaId() === tapa.tapaId) {
            <div class="border-t border-stone-100 bg-stone-50 p-3">
              <app-tapa-review-form
                [barId]="barId()"
                [tapaId]="tapa.tapaId"
                [review]="tapa.myReview"
                (saved)="changed.emit()"
                (cancelled)="expandedTapaId.set(null)"
              />
              <app-bar-tapa-remove 
                [barId]="barId()"
                [tapaId]="tapa.tapaId"
                [tapaName]="tapa.tapaName"
                (removed)="changed.emit()"
              />
            </div>
          }
        </li>
      }
    </ul>
  }

  <app-bar-tapa-add-form [barId]="barId()" [tapas]="tapas()" (added)="changed.emit()" />
</section>
