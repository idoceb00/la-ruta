<section class="mx-auto max-w-sm pt-4">
  <h1 class="font-display text-6xl leading-none font-extrabold tracking-tight uppercase">La Ruta</h1>
  <p class="mt-2 text-muted">Tus bares, tus tapas, sin dar vueltas.</p>

  <hr class="my-6 border-t-2 border-ink" />

  <h2 class="font-display text-2xl font-extrabold uppercase">Entra y sigue el tapeo</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-5 flex flex-col gap-4">
    <label class="flex flex-col gap-1.5">
      <span class="eyebrow">Usuario</span>
      <input appInput type="text" formControlName="username" autocomplete="username" />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <span class="text-xs font-medium text-wine">El usuario es obligatorio.</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="eyebrow">Contraseña</span>
      <input appInput type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="text-xs font-medium text-wine">La contraseña es obligatoria.</span>
      }
    </label>

    @if (errorMessage(); as message) {
      <app-error-box [message]="message" />
    }

    <button appButton type="submit" [disabled]="loading()" class="mt-2">
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p class="mt-10 text-center text-sm text-muted">
    ¿Primera ronda?
    <a routerLink="/register" class="font-semibold text-ink underline underline-offset-2 hover:text-wine">
      Crear cuenta
    </a>
  </p>
</section>
