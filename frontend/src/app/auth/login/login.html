<section class="mx-auto mt-8 max-w-sm rounded-xl bg-white p-6 shadow-sm">
  <h2 class="mb-6 text-2xl font-semibold text-stone-800">Iniciar sesión</h2>

  <div class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-sm text-stone-600">
      Email
      <input type="email" class="rounded-lg border border-stone-300 px-3 py-2 focus:border-amber-600 focus:outline-none" />
    </label>

    <label class="flex flex-col gap-1 text-sm text-stone-600">
      Contraseña
      <input type="password" class="rounded-lg border border-stone-300 px-3 py-2 focus:border-amber-600 focus:outline-none" />
    </label>

    <button type="button" class="mt-2 rounded-lg bg-amber-600 px-4 py-2 font-semibold text-white hover:bg-amber-700">
      Entrar
    </button>
  </div>
</section>
