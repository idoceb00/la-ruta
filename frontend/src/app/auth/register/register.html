<section class="mx-auto mt-8 max-w-sm rounded-xl bg-white p-6 shadow-sm">
  <h2 class="mb-6 text-2xl font-semibold text-stone-800">Crear cuenta</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-sm text-stone-600">
      Usuario
      <input
        type="text"
        formControlName="username"
        autocomplete="username"
        class="rounded-lg border border-stone-300 px-3 py-2 focus:border-amber-600 focus:outline-none" />
      @if (form.controls.username.touched && form.controls.username.hasError('required')) {
        <span class="text-xs text-red-600">El usuario es obligatorio.</span>
      }
      @if (form.controls.username.touched && form.controls.username.hasError('minlength')) {
        <span class="text-xs text-red-600">Mínimo 3 caracteres.</span>
      }
    </label>

    <label class="flex flex-col gap-1 text-sm text-stone-600">
      Contraseña
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        class="rounded-lg border border-stone-300 px-3 py-2 focus:border-amber-600 focus:outline-none" />
      @if (form.controls.password.touched && form.controls.password.hasError('required')) {
        <span class="text-xs text-red-600">La contraseña es obligatoria.</span>
      }
      @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
        <span class="text-xs text-red-600">Mínimo 8 caracteres.</span>
      }
    </label>

    <label class="flex flex-col gap-1 text-sm text-stone-600">
      Repite la contraseña
      <input
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        class="rounded-lg border border-stone-300 px-3 py-2 focus:border-amber-600 focus:outline-none" />
      @if (form.controls.confirmPassword.touched && form.hasError('passwordsMismatch')) {
        <span class="text-xs text-red-600">Las contraseñas no coinciden.</span>
      }
    </label>

    @if (errorMessage()) {
      <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="mt-2 rounded-lg bg-amber-600 px-4 py-2 font-semibold text-white hover:bg-amber-700 disabled:opacity-60">
      {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-stone-500">
    ¿Ya tienes cuenta?
    <a routerLink="/login" class="font-semibold text-amber-700 hover:underline">Entra</a>
  </p>
</section>
