<section class="mx-auto max-w-sm pt-4">
  <h1 class="font-display text-6xl leading-none font-extrabold tracking-tight uppercase">La Ruta</h1>
  <p class="mt-2 text-muted">Tus bares, tus tapas, sin dar vueltas.</p>

  <hr class="my-6 border-t-2 border-ink" />

  <h2 class="font-display text-2xl font-extrabold uppercase">Pide la primera ronda</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-5 flex flex-col gap-4">
    <label class="flex flex-col gap-1.5">
      <span class="eyebrow">Usuario</span>
      <input appInput type="text" formControlName="username" autocomplete="username" />
      @if (form.controls.username.touched && form.controls.username.hasError('required')) {
        <span class="text-xs font-medium text-wine">El usuario es obligatorio.</span>
      }
      @if (form.controls.username.touched && form.controls.username.hasError('minlength')) {
        <span class="text-xs font-medium text-wine">Mínimo 3 caracteres.</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="eyebrow">Contraseña</span>
      <input appInput type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.hasError('required')) {
        <span class="text-xs font-medium text-wine">La contraseña es obligatoria.</span>
      }
      @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
        <span class="text-xs font-medium text-wine">Mínimo 4 caracteres.</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="eyebrow">Repite la contraseña</span>
      <input appInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (form.controls.confirmPassword.touched && form.hasError('passwordsMismatch')) {
        <span class="text-xs font-medium text-wine">Las contraseñas no coinciden.</span>
      }
    </label>

    @if (errorMessage(); as message) {
      <app-error-box [message]="message" />
    }

    <button appButton type="submit" [disabled]="loading()" class="mt-2">
      {{ loading() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>
  </form>

  <p class="mt-10 text-center text-sm text-muted">
    ¿Ya tienes cuenta?
    <a routerLink="/login" class="font-semibold text-ink underline underline-offset-2 hover:text-wine">Entra</a>
  </p>
</section>
