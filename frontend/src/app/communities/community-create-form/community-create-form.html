<form (submit)="onSubmit($event)" class="flex flex-col gap-3 border-[1.5px] border-ink bg-surface p-4">
  <label class="flex flex-col gap-1.5">
    <span class="eyebrow">Nombre de la comunidad</span>
    <input appInput type="text" placeholder="Los de siempre" autocomplete="off" [formField]="createForm.name" />
  </label>

  @if (createForm.name().touched() && createForm.name().invalid()) {
    @for (error of createForm.name().errors(); track error.kind) {
      <p class="text-xs font-medium text-wine">{{ error.message }}</p>
    }
  }

  @if (serverError(); as message) {
    <app-error-box [message]="message" />
  }

  <button appButton type="submit" [disabled]="createForm().invalid() || submitting()">
    {{ submitting() ? 'Creando…' : 'Crear comunidad' }}
  </button>
</form>
