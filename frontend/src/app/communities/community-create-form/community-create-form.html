<form (submit)="onSubmit($event)" class="space-y-2">
  <label for="community-name" class="block text-sm font-medium">Crear comunidad</label>

  <div class="flex gap-2">
    <input
      id="community-name"
      type="text"
      placeholder="Nombre de la comunidad"
      [formField]="createForm.name"
      class="flex-1 rounded-lg border border-gray-300 px-3 py-2"
    />
    <button
      type="submit"
      [disabled]="createForm().invalid() || submitting()"
      class="rounded-lg bg-gray-900 px-4 py-2 font-medium text-white disabled:opacity-50"
    >
      {{ submitting() ? 'Creando…' : 'Crear' }}
    </button>
  </div>

  @if (createForm.name().touched() && createForm.name().invalid()) {
    @for (error of createForm.name().errors(); track error.kind) {
      <p class="text-sm text-red-600">{{ error.message }}</p>
    }
  }

  @if (serverError(); as message) {
    <p class="text-sm text-red-600">{{ message }}</p>
  }
</form>
