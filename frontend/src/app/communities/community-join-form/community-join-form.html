<form (submit)="onSubmit($event)" class="space-y-2">
  <label for="invite-code" class="block text-sm font-medium">Unirse con código</label>

  <div class="flex gap-2">
    <input
      id="invite-code"
      type="text"
      placeholder="Código de invitación"
      autocomplete="off"
      [formField]="joinForm.inviteCode"
      class="flex-1 rounded-lg border border-gray-300 px-3 py-2"
    />
    <button
      type="submit"
      [disabled]="joinForm().invalid() || submitting()"
      class="rounded-lg bg-gray-900 px-4 py-2 font-medium text-white disabled:opacity-50"
    >
      {{ submitting() ? 'Uniendo…' : 'Unirse' }}
    </button>
  </div>

  @if (joinForm.inviteCode().touched() && joinForm.inviteCode().invalid()) {
    @for (error of joinForm.inviteCode().errors(); track error.kind) {
      <p class="text-sm text-red-600">{{ error.message }}</p>
    }
  }

  @if (serverError(); as message) {
    <p class="text-sm text-red-600">{{ message }}</p>
  }
</form>
