<form (submit)="onSubmit($event)" class="flex flex-col gap-3 border-[1.5px] border-ink bg-surface p-4">
  <label class="flex flex-col gap-1.5">
    <span class="eyebrow">Código de invitación</span>
    <input
      appInput
      type="text"
      placeholder="Pídeselo a alguien de la comunidad"
      autocomplete="off"
      spellcheck="false"
      [formField]="joinForm.inviteCode"
    />
  </label>

  @if (joinForm.inviteCode().touched() && joinForm.inviteCode().invalid()) {
    @for (error of joinForm.inviteCode().errors(); track error.kind) {
      <p class="text-xs font-medium text-wine">{{ error.message }}</p>
    }
  }

  @if (serverError(); as message) {
    <app-error-box [message]="message" />
  }

  <button appButton type="submit" [disabled]="joinForm().invalid() || submitting()">
    {{ submitting() ? 'Uniéndote…' : 'Unirse' }}
  </button>
</form>
