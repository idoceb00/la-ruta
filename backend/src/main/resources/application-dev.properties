# Load local environment variables from the repo root .env
spring.config.import=optional:file:../.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
# spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/schema.sql
# spring.jpa.properties.hibernate.hbm2ddl.delimiter=;

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.cors.allowed-origins=http://localhost:4200

# Display the SQL generated by Hibernate in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true