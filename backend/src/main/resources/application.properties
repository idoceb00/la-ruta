spring.application.name=backend

# Load local environment variables from the repo root .env (optional: not present in deployment)
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL datasource (values from .env locally, from the platform in deployment)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Flyway owns the schema; Hibernate only validates it against the entities
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
# spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/schema.sql
# spring.jpa.properties.hibernate.hbm2ddl.delimiter=;

# Display the SQL generated by Hibernate in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=7d