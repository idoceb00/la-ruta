spring.application.name=backend

# PostgreSQL datasource (values from .env locally, from the platform in deployment)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE}?sslmode=${PGSSLMODE:prefer}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Let idle connections close so serverless Postgres (Neon) can scale to zero
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000

# Flyway owns the schema; Hibernate only validates it against the entities
spring.jpa.hibernate.ddl-auto=validate

# Keep the Hibernate session within service transactions only
spring.jpa.open-in-view=false

# API docs and Swagger UI are only exposed in dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

jwt.secret=${JWT_SECRET}
jwt.expiration=7d