spring.application.name=backend

# PostgreSQL datasource (values from .env locally, from the platform in deployment)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Flyway owns the schema; Hibernate only validates it against the entities
spring.jpa.hibernate.ddl-auto=validate

# Keep the Hibernate session within service transactions only
spring.jpa.open-in-view=false

server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

jwt.secret=${JWT_SECRET}
jwt.expiration=7d