spring.application.name=backend

# Datasource is provided by the Testcontainers PostgreSQL container (@ServiceConnection)
# Flyway applies the migrations; Hibernate validates the entities against them
spring.jpa.hibernate.ddl-auto=validate

# Keep the Hibernate session within service transactions only
spring.jpa.open-in-view=false

# API docs and Swagger UI are only exposed in dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.cors.allowed-origins=http://localhost:4200

